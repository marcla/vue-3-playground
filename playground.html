<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground - Intro Vue 3</title>
  </head>
  <body>
    <h1>Hello Playground</h1>

    <div id="app">
      <h2 v-if="message.includes('!')">{{message.toUpperCase()}}</h2>
      <p v-else>{{message}}</p>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue

      const app = createApp({
        data() {
          return {
            message: `Hello, it's works!`,
          }
        },
      })

      app.mount('#app')
    </script>
  </body>
</html>
